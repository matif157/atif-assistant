plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

// Release signing: ../keystore.properties + ../release.keystore (both
// gitignored). Without them the release build is simply unsigned.
def ksProps = new Properties()
def ksFile = file("../keystore.properties")
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace "ai.atif.assistant"
    compileSdk 36

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile file("../" + ksProps["storeFile"])
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
                // v1 stays enabled on purpose: Android 7+ installs v2-only
                // fine, but several OEM sideload installers (known Infinix
                // XOS / Tecno quirk) run the legacy JAR verifier first and
                // fail with a bare "App not installed" when v1 is absent.
                v1SigningEnabled = true
                v2SigningEnabled = true
            }
        }
    }

    defaultConfig {
        applicationId "ai.atif.assistant"
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName "1.3.2"
        // arm64 only: every phone that can run a 1.5B model, plus the arm64
        // emulator. Chaquopy insists these live in defaultConfig (buildType
        // filters are ignored), so x86_64 images are not supported - use an
        // arm64 system image for the AVD.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // MainActivity passes VERSION_CODE-backed state to the Python side.
        buildConfig true
    }

    packaging {
        jniLibs {
            // Extract jniLibs (libllama-server.so) into nativeLibraryDir so
            // the app can execve() them. Uncompressed in-APK libs (the AGP 8
            // default) cannot be executed, and filesDir is W^X-blocked.
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            // build_apk.sh stages the Python package and the web/ assets here first.
            python.srcDirs = ["src/main/python"]
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        pip {
            // Chaquopy's package index has no pydantic (v2 needs the native
            // pydantic-core extension, which it cannot build), so we pin the
            // pure-Python pydantic v1 line and a FastAPI release that supports
            // it. Exact pins = the set proven green by the 429-test suite in a
            // clean venv (pydantic 1.10.26 fixed Python 3.12.4+ ForwardRef).
            // pydantic first: a later `install` never re-resolves it to v2.
            install "pydantic==1.10.26"
            install "fastapi==0.115.14"
            // uvicorn WITHOUT [standard]: the optional C extensions (uvloop,
            // httptools) are not needed and are the most likely build breakage.
            install "uvicorn==0.54.0"
            install "httpx==0.28.1"
            install "pypdf==6.20.1"
        }
    }
}

dependencies {
    // Nothing beyond the Android framework + Chaquopy is required. The activity
    // uses the platform WebView and a JS bridge for voice.
}
