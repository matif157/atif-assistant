[project]
name = "atif-assistant"
version = "0.1.0"
description = "Atif Assistant - personal intelligence system with persistent memory, Reality Engine, Challenge Mode and Pattern Radar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dateutil>=2.9",
    "jinja2>=3.1",
    "pypdf>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atif_assistant"]