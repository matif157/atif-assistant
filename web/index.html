<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Raees</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="dot"></span>
    <strong>RAEES</strong>
    <span class="sub" id="statusline">personal intelligence</span>
  </div>
  <button class="ghost" id="btn-memory" title="Search memory">MEM</button>
</header>

<main id="chat"></main>

<footer>
  <div class="modes">
    <button class="mode active" data-mode="ask">ASK</button>
    <button class="mode" data-mode="challenge">CHALLENGE</button>
    <button class="mode" data-mode="decide">DECIDE</button>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask. Or type /challenge, /decide"></textarea>
    <button id="send" aria-label="Send">&#10148;</button>
  </div>
  <div class="hint" id="hint">Reality Engine labels every claim. Challenge Mode argues against you.</div>
</footer>

<div class="sheet" id="memory-sheet" hidden>
  <div class="sheet-head">
    <strong>MEMORY</strong>
    <input id="memq" placeholder="search facts, episodes, rules">
    <button class="ghost" id="close-memory">CLOSE</button>
  </div>
  <div id="mem-results"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
