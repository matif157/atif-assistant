<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Raees</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="dot"></span>
    <strong>RAEES</strong>
    <span class="sub" id="statusline">personal intelligence</span>
  </div>
  <button class="ghost" id="btn-memory" title="Search memory">MEM</button>
  <button class="ghost" id="btn-insights" title="What you keep asking">INSIGHTS</button>
</header>

<main id="chat"></main>

<footer>
  <div class="route" id="route" hidden>
    <span class="route-mode" id="route-mode"></span>
    <span class="route-why" id="route-why"></span>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask. Raees decides how to answer."></textarea>
    <button id="send" aria-label="Send">&#10148;</button>
  </div>
  <div class="hint" id="hint">Every claim labelled. No mode to pick - Raees routes each question itself.</div>
</footer>

<div class="sheet" id="memory-sheet" hidden>
  <div class="sheet-head">
    <strong>MEMORY</strong>
    <input id="memq" placeholder="search facts, episodes, rules">
    <button class="ghost" id="close-memory">CLOSE</button>
  </div>
  <div id="mem-results"></div>
</div>

<div class="sheet" id="insights-sheet" hidden>
  <div class="sheet-head">
    <strong>INSIGHTS</strong>
    <button class="ghost" id="close-insights">CLOSE</button>
  </div>
  <div id="insights-body"></div>
</div>

<div class="sheet" id="learned-sheet" hidden>
  <div class="sheet-head">
    <strong>LEARNED - NEEDS YOUR APPROVAL</strong>
    <button class="ghost" id="close-learned">CLOSE</button>
  </div>
  <div id="learned-body"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
