<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Atif Assistant</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="dot"></span>
    <strong>ATIF ASSISTANT</strong>
    <span class="sub" id="statusline">personal intelligence</span>
  </div>
  <button class="ghost" id="btn-memory" title="Search memory">MEM</button>
  <button class="ghost" id="btn-insights" title="What you keep asking">INSIGHTS</button>
  <button class="ghost" id="btn-decisions" title="Decisions you owe a review">LEDGER</button>
</header>

<main id="chat"></main>

<footer>
  <div class="route" id="route" hidden>
    <span class="route-mode" id="route-mode"></span>
    <span class="route-why" id="route-why"></span>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask. Atif Assistant decides how to answer."></textarea>
    <button id="send" aria-label="Send">&#10148;</button>
  </div>
  <div class="hint" id="hint">Every claim labelled. No mode to pick - Atif Assistant routes each question itself.</div>
</footer>

<div class="sheet" id="memory-sheet" hidden>
  <div class="sheet-head">
    <strong>MEMORY</strong>
    <input id="memq" placeholder="search facts, episodes, rules">
    <button class="ghost" id="close-memory">CLOSE</button>
  </div>
  <div id="mem-results"></div>
</div>

<div class="sheet" id="insights-sheet" hidden>
  <div class="sheet-head">
    <strong>INSIGHTS</strong>
    <button class="ghost" id="close-insights">CLOSE</button>
  </div>
  <div id="insights-body"></div>
</div>

<div class="sheet" id="learned-sheet" hidden>
  <div class="sheet-head">
    <strong>LEARNED - NEEDS YOUR APPROVAL</strong>
    <button class="ghost" id="close-learned">CLOSE</button>
  </div>
  <div id="learned-body"></div>
</div>

<div class="sheet" id="decisions-sheet" hidden>
  <div class="sheet-head">
    <strong>DECISION LEDGER</strong>
    <button class="ghost" id="toggle-log">LOG A DECISION</button>
    <button class="ghost" id="close-decisions">CLOSE</button>
  </div>
  <form id="decision-form" hidden>
    <label>TOPIC<input name="topic" required placeholder="the thing you are deciding"></label>
    <label>WHAT YOU ARE DOING<input name="decision" required placeholder="the action, concretely"></label>
    <label>PREDICTION - what you expect to happen<textarea name="prediction" rows="2" placeholder="be specific enough to be wrong"></textarea></label>
    <label>CONFIDENCE 0-1<input name="confidence" type="number" min="0" max="1" step="0.05" placeholder="0.6"></label>
    <label>REVIEW ON<input name="review_date" type="date"></label>
    <div class="form-actions">
      <button type="submit" id="save-decision">SAVE</button>
      <button type="button" class="ghost" id="cancel-log">CANCEL</button>
    </div>
  </form>
  <div id="decisions-body"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
